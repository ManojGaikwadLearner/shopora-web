<div class="container">
  <h1 class="mt-3 mb-3">Products</h1>
  <div class="table-card">
    <table class="table table-hover m-0">
      <thead class="table-dark">
          <tr>
            <th *ngFor="let column of columns">{{ column }}</th>
          </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products(); trackBy: trackById">
          <td class="align-middle"><img src="{{ product.imageUrl }}" height="50"/></td>
          <td class="align-middle">{{ product.name }}</td>
          <td class="align-middle">{{ product.unitPrice | currency: 'USD' }}</td>
          <td class="align-middle">{{ product.unitsInStock }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
