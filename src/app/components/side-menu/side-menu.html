<aside class="menu-sidebar d-none d-lg-block">
  <div class="logo">
    <a [routerLink]="PATHS.productList">
      <img src="assets/images/logo.png" alt="Shopora" class="img-responsive" />
    </a>
  </div>
  <div class="menu-sidebar-content js-scrollbar1">
    <nav class="navbar-sidebar" aria-label="Product categories">
      <ul class="list-unstyled navbar-list">
        @for (category of productCategories(); track category.id) {
          <li>
            <a [routerLink]="[PATHS.category, category.id]" routerLinkActive="active-link">{{ category.categoryName }}</a>
          </li>
        }
      </ul>
    </nav>
  </div>
</aside>
