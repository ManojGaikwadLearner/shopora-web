<div class="login-status-header">
    @if (isAuthenticated()) {
        <div class="login-status-user-info">Welcome back {{ userFullName() }}</div>
        <button (click)="logout()" class="security-btn">Logout</button>
        <button style="margin-left: 10px;" [routerLink]="PATHS.membersPage" class="security-btn">Member</button>
    } @else {
        <button [routerLink]="PATHS.login" class="security-btn">Login</button>
    }
</div>
