<div class="row">
    <div class="col-md-2"><label [attr.for]="for()">{{ label() }}</label></div>
    <div class="col-md-9">
        <div class="input-space"><ng-content /></div>
            @if (errorMessage(); as message) {
                <div class="alert alert-danger">
                    <div>{{ message }}</div>
                </div>
            }
    </div>
</div>
