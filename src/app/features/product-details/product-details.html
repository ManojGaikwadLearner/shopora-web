<div class="detail-section">
    <div class="container-fluid">
        <img src="{{product()?.imageUrl}}" alt="" class="detail-img">
        <h3>{{product()?.name}}</h3>
        <div class="price">{{ product()?.unitPrice | currency: 'USD' }}</div>
        <button (click)="addToCart(product())" class="btn btn-primary btn-sm">Add to cart</button>

        <hr>
        <h4>Description</h4>
        <p>{{product()?.description}}</p>

        <a [routerLink]="[PATHS.productList]" class="mt-5">Back to Products</a>

         @if (product() == null) {
            <div class="alert alert-warning col-md-12" role="alert">
              No product detail found.
            </div>
        }

        @if (error()) {
            <div class="alert alert-danger col-md-12" role="alert">
              {{ error() }}
            </div>
        }
    </div>
</div>
