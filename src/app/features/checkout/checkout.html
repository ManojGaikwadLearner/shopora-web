<app-page-layout variant="main-page-m">
            <form [formGroup]="form" (ngSubmit)="onSubmit()">

                <fieldset formGroupName="customer" class="form-area">
                    <h3>Customer</h3>
                    <app-field-row label="First name" for="firstName" [control]="form.controls.customer.controls.firstName">
                        <input id="firstName" type="text" formControlName="firstName" autocomplete="given-name" />
                    </app-field-row>
                    <app-field-row label="Last name" for="lastName" [control]="form.controls.customer.controls.lastName">
                        <input id="lastName" type="text" formControlName="lastName" autocomplete="family-name" />
                    </app-field-row>
                    <app-field-row label="Email" for="email" [control]="form.controls.customer.controls.email">
                        <input id="email" type="email" formControlName="email" autocomplete="email" />
                    </app-field-row>
                </fieldset>

                <app-address-fieldset legend="Shipping Address" idPrefix="shipping"
                                        [group]="form.controls.shippingAddress"
                                        [countries]="countries()" [states]="shippingAddressStates()"
                                        (countrySelected)="getStates($event)" />

                <div class="input-space">
                    <label for="copyAddress" class="au-checkbox">
                    <input type="checkbox" id="copyAddress"
                            (change)="copyShippingAddressToBillingAddress($event)" />
                    <span class="au-checkmark"></span>Billing address same as shipping address
                    </label>
                </div>

                <app-address-fieldset legend="Billing Address" idPrefix="billing"
                                        [group]="form.controls.billingAddress"
                                        [countries]="countries()" [states]="billingAddressStates()"
                                        (countrySelected)="getStates($event)" />

                <!-- Stripe Element -->
                <app-stripe-payment />

                <div class="form-area">
                    <h3>Review your order</h3>
                    <app-order-summary></app-order-summary>
                </div>

                <div class="text-center">
                    <button type="submit" [disabled]="submitting() || !payment().ready()" class="btn btn-info">
                        {{ submitting() ? 'Processing…' : 'Purchase' }}
                    </button>
                </div>
            </form>
</app-page-layout>
