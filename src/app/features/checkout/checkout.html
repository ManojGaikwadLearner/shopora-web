<div class="main-content page-m">
    <div class="section-content section-content-p30">
        <div class="container-fluid">
            <form [formGroup]="form" (ngSubmit)="onSubmit()">

                <fieldset formGroupName="customer" class="form-area">
                    <h3>Customer</h3>
                    <app-field-row label="First name" for="firstName" [control]="form.controls.customer.controls.firstName">
                        <input id="firstName" type="text" formControlName="firstName" autocomplete="given-name" />
                    </app-field-row>
                    <app-field-row label="Last name" for="lastName" [control]="form.controls.customer.controls.lastName">
                        <input id="lastName" type="text" formControlName="lastName" autocomplete="family-name" />
                    </app-field-row>
                    <app-field-row label="Email" for="email" [control]="form.controls.customer.controls.email">
                        <input id="email" type="email" formControlName="email" autocomplete="email" />
                    </app-field-row>
                </fieldset>

                <app-address-fieldset legend="Shipping Address" idPrefix="shipping"
                                        [group]="form.controls.shippingAddress"
                                        [countries]="countries()" [states]="shippingAddressStates()"
                                        (countrySelected)="getStates($event)" />

                <div class="input-space">
                    <label for="copyAddress" class="au-checkbox">
                    <input type="checkbox" id="copyAddress"
                            (change)="copyShippingAddressToBillingAddress($event)" />
                    <span class="au-checkmark"></span>Billing address same as shipping address
                    </label>
                </div>

                <app-address-fieldset legend="Billing Address" idPrefix="billing"
                                        [group]="form.controls.billingAddress"
                                        [countries]="countries()" [states]="billingAddressStates()"
                                        (countrySelected)="getStates($event)" />

                <fieldset formGroupName="creditCard" class="form-area">
                    <h3>Credit Card</h3>
                    <app-field-row label="Card type" for="cardType" [control]="form.controls.creditCard.controls.cardType">
                    <select id="cardType" formControlName="cardType">
                        <option value="VISA">Visa</option>
                        <option value="MASTERCARD">Mastercard</option>
                    </select>
                    </app-field-row>
                    <app-field-row label="Name on card" for="nameOnCard" [control]="form.controls.creditCard.controls.nameOnCard">
                    <input id="nameOnCard" type="text" formControlName="nameOnCard" autocomplete="cc-name" />
                    </app-field-row>
                    <app-field-row label="Card number" for="cardNumber" [control]="form.controls.creditCard.controls.cardNumber"
                                [messages]="{ pattern: 'Enter the 16 digits on your card.' }">
                    <input id="cardNumber" type="text" inputmode="numeric" maxlength="16"
                            formControlName="cardNumber" autocomplete="cc-number" />
                    </app-field-row>
                    <app-field-row label="Security code" for="securityCode" [control]="form.controls.creditCard.controls.securityCode"
                                [messages]="{ pattern: 'Enter the 3 digits on the back.' }">
                    <input id="securityCode" type="text" inputmode="numeric" maxlength="3"
                            formControlName="securityCode" autocomplete="cc-csc" />
                    </app-field-row>
                    <app-field-row label="Expiration month" for="expirationMonth" [control]="form.controls.creditCard.controls.expirationMonth">
                    <select id="expirationMonth" formControlName="expirationMonth">
                        @for (month of creditCardMonths(); track month) { <option [value]="month">{{ month }}</option> }
                    </select>
                    </app-field-row>
                    <app-field-row label="Expiration year" for="expirationYear" [control]="form.controls.creditCard.controls.expirationYear">
                    <select id="expirationYear" formControlName="expirationYear">
                        @for (year of creditCardYears(); track year) { <option [value]="year">{{ year }}</option> }
                    </select>
                    </app-field-row>
                </fieldset>

                <div class="form-area">
                    <h3>Review your order</h3>
                    <p>Total quantity: {{ totalQuantity() }}</p>
                    <p>Shipping: FREE</p>
                    <p>Total price: {{ totalPrice() | currency: 'USD' }}</p>
                </div>

                <div class="text-center">
                    <button type="submit" [disabled]="submitting()" class="btn btn-info">Purchase</button>
                </div>
            </form>
        </div>
    </div>
</div>
