<div class="page-content">
  <div class="section-content section-content-p30">
    <div class="container-fluid">
        <div class="row">
          @for (product of products(); track product.id) {
            <div class="col-md-3">
              <div class="product-box">
                <a [routerLink]="['/product', product.id]">
                  <img [src]="product.imageUrl" class="img-responsive"/>
                </a>
                <a [routerLink]="['/product', product.id]" class="clickable no-underline">
                  <h1>{{ product.name }}</h1>
                </a>
                <div class="price">{{ product.unitPrice | currency: 'USD' }}</div>
                <button (click)="addToCart(product)" class="btn btn-primary btn-sm">Add to cart</button>
              </div>
            </div>
          }

          @if (products().length == 0) {
            <div class="alert alert-warning col-md-12" role="alert">
              No products found.
            </div>
          }

          @if (error()) {
            <div class="alert alert-danger col-md-12" role="alert">
              {{ error() }}
            </div>
          }

        </div>
        <div class="footer-pagination d-flex justify-content-between align-items-center flex-wrap gap-3">

          <div class="page-size-selector d-flex align-items-center gap-2">
            <label for="pageSize" class="mb-0">Page Size</label>
            <select id="pageSize" class="form-select form-select-sm w-auto"
                    #myPageSelect (change)="updatePageSize(myPageSelect.value)">
              <option value="5" selected>5</option>
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
          </div>

          <ngb-pagination
            [(page)]="thePageNumber"
            [pageSize]="thePageSize"
            [collectionSize]="theTotalElements"
            [maxSize]="5"
            [boundaryLinks]="true"
            (pageChange)="pageChangeHandler($event)" />

        </div>
    </div>
  </div>
</div>
