<app-page-layout>
  <div class="row">
    @for (product of products(); track product.id) {
      <div class="col-md-3">
        <app-product-card [product]="product" (addToCart)="addToCart($event)" />
      </div>
    }

    @if (products().length == 0) {
      <div class="alert alert-warning col-md-12" role="alert">
        No products found.
      </div>
    }

    @if (error()) {
      <div class="alert alert-danger col-md-12" role="alert">
        {{ error() }}
      </div>
    }

  </div>
  <div class="footer-pagination d-flex justify-content-between align-items-center flex-wrap gap-3">

    <div class="page-size-selector d-flex align-items-center gap-2">
      <label for="pageSize" class="mb-0">Page Size</label>
      <select id="pageSize" class="form-select form-select-sm w-auto"
              #myPageSelect (change)="updatePageSize(myPageSelect.value)">
        <option value="5" selected>5</option>
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
    </div>

    <ngb-pagination
      [(page)]="thePageNumber"
      [pageSize]="thePageSize"
      [collectionSize]="theTotalElements"
      [maxSize]="5"
      [boundaryLinks]="true"
      (pageChange)="pageChangeHandler($event)" />

  </div>
</app-page-layout>
