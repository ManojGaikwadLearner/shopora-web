<div class="page-wrapper">
  @if (showSidebar()) {
    <app-side-menu />      
  }

  <div class="page-container">

    @if (showHeader()) {
      <app-header />
    }

    <app-page-layout variant="main">
      <router-outlet />
    </app-page-layout>

  </div>
</div>

@if (showFooter()) {
  <app-footer />
}
