<div class="page-wrapper">
  @if (showSidebar()) {
    <app-side-menu />
  }

  <div class="page-container">

    @if (showHeader()) {
      <app-header />
    }

    <main class="main-content">
      <div class="section-content section-content-p30">
        <div class="container-fluid">
          <router-outlet />
        </div>
      </div>
    </main>

  </div>
</div>

@if (showFooter()) {
  <app-footer />
}
